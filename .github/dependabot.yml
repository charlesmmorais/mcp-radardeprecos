version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencias:
        patterns: ["*"]
    ignore:
      # mcp 2.x removeu `mcp.server.fastmcp`; a migração será feita à parte.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
