name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Conferir versão
        run: |
          versao=$(python -c "import re,pathlib; print(re.search(r'\"(.+)\"', pathlib.Path('src/mcp_radardeprecos/__init__.py').read_text()).group(1))")
          test "v$versao" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME difere da versão $versao"; exit 1; }
      - run: uv sync --locked --extra dev --no-build
      - name: Construir sdist e wheel
        run: |
          uv run --no-sync python -m build --no-isolation
          uv run --no-sync twine check dist/*
      - name: SBOM (CycloneDX)
        run: |
          versao="${GITHUB_REF_NAME#v}"
          uv export --format cyclonedx1.5 --locked --no-dev --extra metrics --no-hashes -o sbom.json
          # A versão do projeto é dinâmica no pyproject.toml e sai vazia no SBOM.
          uv run --no-sync python -c "import json,sys; d=json.load(open('sbom.json',encoding='utf-8')); c=d['metadata']['component']; c['version']=sys.argv[1]; c['purl']='pkg:pypi/mcp-radardeprecos@'+sys.argv[1]; json.dump(d,open('dist/mcp-radardeprecos-'+sys.argv[1]+'.cdx.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)" "$versao"
      - name: Extrair notas do CHANGELOG
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" '
            index($0, "## [" v "]") == 1 {ativo=1; next}
            ativo && /^## \[/ {exit}
            ativo && /^\[.*\]: / {exit}
            ativo {print}
          ' CHANGELOG.md > notas.md
          cat notas.md
          test -s notas.md || { echo "Seção da versão não encontrada no CHANGELOG"; exit 1; }
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notas.md --verify-tag
