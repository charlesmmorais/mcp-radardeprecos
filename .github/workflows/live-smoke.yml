# Testes contra as APIs reais (PNCP, Compras.gov.br, BCB...). Detectam mudanças
# nas fontes que a suíte offline não enxerga. Uma falha aqui pode ser
# instabilidade ou mudança da fonte, não necessariamente um defeito do projeto.
name: Live smoke

on:
  schedule:
    - cron: "0 9 * * 1" # segundas, 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev --no-build
      - run: uv run --no-sync pytest -m live -q
