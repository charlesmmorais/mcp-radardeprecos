name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Análise SonarQube Cloud
    runs-on: ubuntu-latest
    # PRs de forks não recebem o SONAR_TOKEN; a análise roda só no repositório.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: o Sonar usa o blame para separar código novo.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Testes com cobertura
        run: pytest -q --cov=mcp_radardeprecos --cov-report=xml
      - name: Análise
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
