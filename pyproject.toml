[project]
name = "mcp-radardeprecos"
dynamic = ["version"]  # fonte única: src/mcp_radardeprecos/__init__.py
description = "Servidor MCP de pesquisa de preços e contratações públicas brasileiras (PNCP, Compras.gov.br, BCB, TCU)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Charles Morais Magalhães" }]
keywords = [
    "mcp", "model-context-protocol", "pncp", "compras-gov", "licitacoes",
    "pesquisa-de-precos", "in-65-2021", "contratacoes-publicas",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    # mcp 2.x removeu `mcp.server.fastmcp`; a migração ainda não foi feita.
    "mcp[cli]>=1.2.0,<3.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "uvicorn>=0.23",
    "anyio>=4.0",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/charlesmmorais/mcp-radardeprecos"
Repository = "https://github.com/charlesmmorais/mcp-radardeprecos"
Issues = "https://github.com/charlesmmorais/mcp-radardeprecos/issues"
Documentation = "https://github.com/charlesmmorais/mcp-radardeprecos/tree/main/docs"
Changelog = "https://github.com/charlesmmorais/mcp-radardeprecos/blob/main/CHANGELOG.md"

[project.scripts]
mcp-radardeprecos = "mcp_radardeprecos.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mcp_radardeprecos/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_radardeprecos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Testes ao vivo (tests/test_live_smoke.py) ficam fora da rodada padrão:
# rode-os com `pytest -m live`.
addopts = '-m "not live"'
markers = [
    "live: chamadas REAIS às APIs públicas (excluídos por padrão; rode com: pytest -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Docstrings citam URLs e trechos de norma que não valem a pena quebrar.
ignore = ["E501"]
