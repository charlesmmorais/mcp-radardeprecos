sonar.organization=charlesmmorais
sonar.projectKey=charlesmmorais_mcp-radardeprecos
sonar.projectName=mcp-radardeprecos

# O escopo (o que é código e o que é teste) fica na tela "Analysis scope" do
# SonarQube Cloud, que analisa o repositório inteiro e reconhece tests/ como
# testes; sonar.sources e sonar.tests não têm mais efeito.
sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Scripts operacionais (ex.: smoke_mcp.py) rodam à mão contra um servidor
# publicado e não têm testes automatizados: ficam fora só da cobertura, e
# continuam na análise de bugs e vulnerabilidades.
sonar.coverage.exclusions=scripts/**
